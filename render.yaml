services:
  - type: web
    name: four-quadrant-simulator
    runtime: docker
    repo: https://github.com/LBrontesi/mc-quadrant-sim
    branch: web-ui-prod
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 7860
